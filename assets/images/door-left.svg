<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="100%" height="100%">
  <defs>
    <!-- ダークグレー〜ブラックの扉本体グラデーション -->
    <linearGradient id="doorBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="60%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#202026"/>
    </linearGradient>

    <!-- 扉内側（右縁）からの光の反射グラデーション -->
    <radialGradient id="innerGlow" cx="100%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#ffe58f" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8a5a00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- ゴールドの縁取り用縦方向グラデーション -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aa7c11"/>
      <stop offset="20%" stop-color="#fff0a8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#fff0a8"/>
      <stop offset="100%" stop-color="#8a5a00"/>
    </linearGradient>

    <!-- うっすらとしたゴールドの面反射 -->
    <linearGradient id="surfaceHighlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 扉メイン形状（ロゴの左扉のパース形状を維持） -->
  <g id="left-door-panel">
    <!-- ベースの扉 -->
    <polygon points="20,20 180,80 180,420 20,480" fill="url(#doorBody)" />

    <!-- 光の拡散レイヤー -->
    <polygon points="20,20 180,80 180,420 20,480" fill="url(#innerGlow)" />
    
    <!-- 面のハイライト -->
    <polygon points="20,20 180,80 180,420 20,480" fill="url(#surfaceHighlight)" />

    <!-- 輪郭・ラインアクセント -->
    <!-- 外側・上下の微細ライン -->
    <line x1="20" y1="20" x2="180" y2="80" stroke="url(#goldRim)" stroke-width="1" opacity="0.6"/>
    <line x1="180" y1="420" x2="20" y2="480" stroke="url(#goldRim)" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="20" x2="20" y2="480" stroke="#33333a" stroke-width="1" opacity="0.5"/>

    <!-- 右縁（光が漏れ出る中央側のゴールドエッジ） -->
    <line x1="180" y1="80" x2="180" y2="420" stroke="url(#goldRim)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
