name: Publish Quoreal website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quoreal-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare approved static files
        run: |
          mkdir /tmp/quoreal-site
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' ./ /tmp/quoreal-site/
          test -f /tmp/quoreal-site/index.html
      - name: Deploy existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 444e1c31776d12a25b760ede3307d918
          command: pages deploy /tmp/quoreal-site --project-name=quoreal-inc --branch=main
